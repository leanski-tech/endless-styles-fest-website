    <script id="esf-motion-script">
    (() => {
      const start = () => {
        const waitForApp = (tries=0) => {
          const hero=document.querySelector('.hero');
          if(!hero && tries<80){setTimeout(()=>waitForApp(tries+1),75);return}

          const targets=[
            ...document.querySelectorAll('.sec,.gallery-hd,.video-hd,.stats-bar,.countdown,.impact-banner,.past-sponsors,.team-card,.tier,.contact-box')
          ];
          targets.forEach(el=>el.classList.add('motion-reveal'));

          if('IntersectionObserver' in window){
            const io=new IntersectionObserver(entries=>{
              entries.forEach(entry=>{
                if(entry.isIntersecting){
                  entry.target.classList.add('motion-in');
                  entry.target.querySelectorAll('.stat-n').forEach(n=>{
                    n.classList.remove('motion-count'); void n.offsetWidth; n.classList.add('motion-count');
                  });
                  io.unobserve(entry.target);
                }
              });
            },{threshold:.12,rootMargin:'0px 0px -8% 0px'});
            targets.forEach(el=>io.observe(el));
          }else{
            targets.forEach(el=>el.classList.add('motion-in'));
          }

          document.querySelectorAll('.logo-cell').forEach((el,i)=>{el.style.animationDelay=(-i*.35)+'s'});
        };
        waitForApp();
      };
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
      else start();
    })();
    </script>

  
    <script id="esf-gallery-script">
    (() => {
      const bootGallery = (tries=0) => {
        const stage=document.querySelector('.gallery-stage');
        if(!stage && tries<80){setTimeout(()=>bootGallery(tries+1),75);return}
        if(!stage || stage.dataset.enhanced==='1')return;
        stage.dataset.enhanced='1';
        stage.tabIndex=0;
        stage.setAttribute('role','region');
        stage.setAttribute('aria-label','Endless Styles Festival photo gallery. Use left and right arrow keys or swipe.');

        const prev=()=>stage.querySelector('.gal-arrow.left')?.click();
        const next=()=>stage.querySelector('.gal-arrow.right')?.click();

        stage.addEventListener('keydown',e=>{
          if(e.key==='ArrowLeft'){e.preventDefault();prev()}
          if(e.key==='ArrowRight'){e.preventDefault();next()}
        });

        let startX=0,startY=0,active=false;
        stage.addEventListener('touchstart',e=>{
          if(!e.touches?.length)return;
          startX=e.touches[0].clientX;
          startY=e.touches[0].clientY;
          active=true;
          stage.classList.add('gallery-interacting');
        },{passive:true});

        stage.addEventListener('touchend',e=>{
          if(!active)return;
          active=false;
          stage.classList.remove('gallery-interacting');
          const t=e.changedTouches?.[0];
          if(!t)return;
          const dx=t.clientX-startX;
          const dy=t.clientY-startY;
          if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.25){
            dx<0?next():prev();
          }
        },{passive:true});

        stage.addEventListener('pointerdown',()=>stage.classList.add('gallery-interacting'));
        window.addEventListener('pointerup',()=>stage.classList.remove('gallery-interacting'),{passive:true});

        const slides=[...stage.querySelectorAll('.gallery-slide')];
        const preloadAdjacent=()=>{
          const i=slides.findIndex(s=>s.classList.contains('active'));
          if(i<0)return;
          [1,2,-1].forEach(offset=>{
            const slide=slides[(i+offset+slides.length)%slides.length];
            const img=slide?.querySelector('img');
            if(!img?.src)return;
            const preload=new Image();
            preload.decoding='async';
            preload.src=img.src;
          });
        };

        preloadAdjacent();
        const mo=new MutationObserver(preloadAdjacent);
        slides.forEach(slide=>mo.observe(slide,{attributes:true,attributeFilter:['class']}));

        const counter=stage.querySelector('.gal-counter');
        if(counter) counter.setAttribute('aria-live','polite');
      };

      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',()=>bootGallery(),{once:true});
      }else bootGallery();
    })();
    </script>
